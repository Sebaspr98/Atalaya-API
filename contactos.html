<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contactos recibidos</title>
  <style>
    :root {
      --bg: #f4f7ff;
      --surface: #ffffff;
      --text: #18212f;
      --muted: #60708d;
      --border: #dde4f2;
      --primary: #3461ff;
    }

    body.dark {
      --bg: #0f172a;
      --surface: #111827;
      --text: #f8fafc;
      --muted: #cbd5e1;
      --border: #334155;
      --primary: #7c9cff;
    }

    body {
      font-family: "Titillium Web", Arial, sans-serif;
      margin: 0;
      padding: 2rem;
      background: linear-gradient(180deg, var(--bg) 0%, #eef3ff 100%);
      color: var(--text);
      transition: background 0.2s ease, color 0.2s ease;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 1.5rem;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }

    .topbar h1 {
      margin: 0;
      font-size: 1.7rem;
    }

    .topbar p {
      margin: 0.2rem 0 0;
      color: var(--muted);
    }

    .card {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      padding: 1rem 1.1rem;
      margin-bottom: 1rem;
      border-radius: 16px;
    }

    .card h3 {
      margin: 0 0 0.35rem;
      color: var(--primary);
    }

    .card p {
      margin: 0.25rem 0;
      color: var(--muted);
    }

    .empty {
      color: var(--muted);
      padding: 1rem 0;
    }

    .theme-toggle {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 999px;
      padding: 0.65rem 0.9rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="panel">
      <div class="topbar">
        <div>
          <h1>Contactos recibidos</h1>
          <p>Listado de mensajes enviados desde el formulario.</p>
        </div>
        <button id="theme-toggle" class="theme-toggle" type="button">🌙</button>
      </div>
      <div id="lista-contactos">Cargando...</div>
    </div>
  </div>

  <script>
    const themeToggle = document.getElementById('theme-toggle');

    function aplicarTema(theme) {
      document.body.classList.toggle('dark', theme === 'dark');
      if (themeToggle) {
        themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
      }
    }

    const temaGuardado = localStorage.getItem('theme');
    aplicarTema(temaGuardado || 'light');

    if (themeToggle) {
      themeToggle.addEventListener('click', () => {
        const temaActual = document.body.classList.contains('dark') ? 'dark' : 'light';
        const nuevoTema = temaActual === 'dark' ? 'light' : 'dark';
        localStorage.setItem('theme', nuevoTema);
        aplicarTema(nuevoTema);
      });
    }
    async function cargarContactos() {
      const contenedor = document.getElementById('lista-contactos');
      try {
        const respuesta = await fetch('/api/contactos');
        const contactos = await respuesta.json();

        if (!contactos.length) {
          contenedor.innerHTML = '<p class="empty">No hay contactos guardados todavía.</p>';
          return;
        }

        contenedor.innerHTML = contactos.map(contacto => `
          <article class="card">
            <h3>${contacto.nombre}</h3>
            <p><strong>Email:</strong> ${contacto.email}</p>
            <p><strong>Mensaje:</strong> ${contacto.mensaje}</p>
            <p><small>${new Date(contacto.fecha).toLocaleString()}</small></p>
          </article>
        `).join('');
      } catch (error) {
        contenedor.innerHTML = '<p class="empty">No se pudieron cargar los contactos.</p>';
      }
    }

    cargarContactos();
  </script>
</body>
</html>
